[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-bess-revenue-stack"
version = "0.1.0"
description = "How much can a battery earn in Poland by stacking day-ahead arbitrage with balancing capacity (FCR, aFRR, mFRR), and how many megawatts of batteries can the reserve markets absorb? PSE open data, MILP backtest, supply-curve saturation model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pl-bess-revenue-stack = "bess_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
